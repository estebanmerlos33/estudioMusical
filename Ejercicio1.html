<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identificación de notas</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>¿Qué nota es?</h1>

    <section class="campo">
      <label for="pregunta">Posición en el diapasón</label>
      <p id="pregunta" class="pregunta-texto">Cuerda 6, traste 0</p>
    </section>

    <section class="campo">
      <label for="respuesta">Tu respuesta</label>
      <input type="text" id="respuesta" placeholder="Ej: Do, Re#, Solb...">
    </section>

    <div class="botones">
      <button id="btn-validar">Validar respuesta</button>
      <button id="btn-nueva" class="secundario">Nueva pregunta</button>
    </div>

    <p id="resultado" class="resultado" aria-live="polite"></p>

    <a class="enlace-volver" href="index.html">&larr; Volver al menú</a>
  </main>

  <script src="diapason.js?v=1"></script>
  <script src="script1.js?v=3"></script>
</body>
</html>
