<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicios de guitarra</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta tarjeta-menu">
    <h1>Ejercicios de guitarra</h1>
    <p class="subtitulo">Elige un ejercicio para practicar</p>

    <nav class="lista-ejercicios">
      <button class="opcion-ejercicio" data-destino="ejercicio1.html">
        <span class="numero">1</span>
        <span class="texto">
          <span class="titulo-ejercicio">Identificación de notas</span>
          <span class="descripcion-ejercicio">Dada una cuerda y un traste, indica la nota</span>
        </span>
      </button>

      <button class="opcion-ejercicio" data-destino="ejercicio2.html">
        <span class="numero">2</span>
        <span class="texto">
          <span class="titulo-ejercicio">Identificación de trastes</span>
          <span class="descripcion-ejercicio">Dada una nota y una cuerda, indica el traste</span>
        </span>
      </button>

      <button class="opcion-ejercicio" data-destino="ejercicio3.html">
        <span class="numero">3</span>
        <span class="texto">
          <span class="titulo-ejercicio">Identificación de intervalo</span>
          <span class="descripcion-ejercicio">Dadas dos notas, indica el intervalo</span>
        </span>
      </button>

      <button class="opcion-ejercicio" data-destino="ejercicio4.html">
        <span class="numero">4</span>
        <span class="texto">
          <span class="titulo-ejercicio">Identificación de intervalo (trastes)</span>
          <span class="descripcion-ejercicio">Dados dos trastes, indica el intervalo</span>
        </span>
      </button>

      <button class="opcion-ejercicio" data-destino="ejercicio5.html">
        <span class="numero">5</span>
        <span class="texto">
          <span class="titulo-ejercicio">Armado de acorde</span>
          <span class="descripcion-ejercicio">Dada nota, tonalidad, estructura e inversión, arma el acorde</span>
        </span>
      </button>

      <button class="opcion-ejercicio" data-destino="ejercicio6.html">
        <span class="numero">6</span>
        <span class="texto">
          <span class="titulo-ejercicio">Identificación de acorde</span>
          <span class="descripcion-ejercicio">Dadas tres notas, indica el acorde</span>
        </span>
      </button>
      
    </nav>
  </main>

  <script src="menu.js?v=1"></script>
</body>
</html>
