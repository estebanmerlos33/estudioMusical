<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#14151a">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <title>Armado de acorde</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="tarjeta">
    <h1>Arma el acorde</h1>

    <section class="campo">
      <label for="cantidad-notas">Cantidad de notas</label>
      <select id="cantidad-notas">
        <option value="3">Tríada (3 notas)</option>
        <option value="4">Tétrada (4 notas)</option>
      </select>
    </section>

    <section class="campo">
      <label>Tipos de acorde a practicar</label>
      <div id="checkboxes-tipo-triada" class="checkbox-grid"></div>
      <div id="checkboxes-tipo-tetrada" class="checkbox-grid oculto"></div>
    </section>

    <section class="campo">
      <label>Inversiones a practicar</label>
      <div id="checkboxes-inversion" class="checkbox-grid"></div>
    </section>

    <section class="campo campo-checkbox">
      <label for="mostrar-formula">
        <input type="checkbox" id="mostrar-formula">
        Mostrar fórmula del acorde solicitado
      </label>
    </section>

    <section class="campo">
      <label for="pregunta">Acorde a armar</label>
      <p id="pregunta" class="pregunta-texto">Re Mayor — Natural (posición fundamental)</p>
    </section>

    <section class="campo">
      <label for="respuesta-construida">Tu respuesta (en orden, de grave a agudo)</label>
      <p id="respuesta-construida" class="pregunta-texto">—</p>
    </section>

    <div id="opciones-letras" class="opciones-grid"></div>
    <div id="opciones-alteraciones" class="opciones-grid"></div>

    <div class="botones">
      <button id="btn-validar">Validar respuesta</button>
      <button id="btn-borrar-ultima" class="secundario">Borrar última nota</button>
      <button id="btn-nueva" class="secundario">Nueva pregunta</button>
    </div>

    <p id="resultado" class="resultado" aria-live="polite"></p>

    <a class="enlace-volver" href="index.html">&larr; Volver al menú</a>
  </main>

  <script src="diapason.js?v=4"></script>
  <script src="acordes.js?v=2"></script>
  <script src="script5.js?v=3"></script>
  <script src="./sw-register.js"></script>
</body>
</html>
