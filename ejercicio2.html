<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Identificación de trastes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>¿En qué traste está?</h1>

    <section class="campo">
      <label for="pregunta">Cuerda y nota</label>
      <p id="pregunta" class="pregunta-texto">Cuerda 6, nota Mi</p>
    </section>

    <section class="campo">
      <label for="respuesta">Número de traste (0 a 12)</label>
      <input type="number" id="respuesta" min="0" max="12" placeholder="Ej: 5">
    </section>

    <div class="botones">
      <button id="btn-validar">Validar respuesta</button>
      <button id="btn-nueva" class="secundario">Nueva pregunta</button>
    </div>

    <p id="resultado" class="resultado" aria-live="polite"></p>

    <a class="enlace-volver" href="index.html">&larr; Volver al menú</a>
  </main>

  <script src="diapason.js?v=3"></script>
  <script src="script2.js?v=2"></script>
</body>
