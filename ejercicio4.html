<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Identificación de intervalo (trastes)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>¿Qué intervalo es?</h1>

    <section class="campo">
      <label for="dificultad">Rango máximo de intervalo</label>
      <select id="dificultad">
        <option value="12">Hasta 8va justa (12 semitonos)</option>
        <option value="11" selected>Hasta 7ma mayor (11 semitonos)</option>
        <option value="13">Hasta 9na menor (13 semitonos)</option>
        <option value="24">Rango completo (24 semitonos)</option>
      </select>
    </section>

    <section class="campo campo-checkbox">
      <label for="aceptar-inversion">
        <input type="checkbox" id="aceptar-inversion">
        Aceptar también el intervalo invertido (según qué nota se tome como referencia)
      </label>
    </section>

    <section class="campo campo-doble">
      <div>
        <label for="max-trastes">Trastes de ancho</label>
        <input type="number" id="max-trastes" min="1" max="13" value="4">
      </div>
      <div>
        <label for="max-cuerdas">Cuerdas de alto</label>
        <input type="number" id="max-cuerdas" min="1" max="6" value="3">
      </div>
    </section>

    <section class="campo">
      <label for="pregunta">Posiciones</label>
      <p id="pregunta" class="pregunta-texto">Cuerda 6, traste 5 &rarr; Cuerda 6, traste 4</p>
    </section>

    <section class="campo">
      <label for="respuesta">Tu respuesta (nombre del intervalo)</label>
      <input type="text" id="respuesta" placeholder="Ej: 3ra mayor, 5ta justa...">
    </section>

    <div class="botones">
      <button id="btn-validar">Validar respuesta</button>
      <button id="btn-nueva" class="secundario">Nueva pregunta</button>
    </div>

    <p id="resultado" class="resultado" aria-live="polite"></p>

    <a class="enlace-volver" href="index.html">&larr; Volver al menú</a>
  </main>

  <script src="diapason.js?v=3"></script>
  <script src="script4.js?v=1"></script>
</body>
</html>
