<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Identificación de intervalo</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="tarjeta">
    <h1>¿Qué intervalo es?</h1>

    <section class="campo">
      <label for="dificultad">Rango máximo</label>
      <select id="dificultad">
        <option value="12">Hasta 8va justa (12 semitonos)</option>
        <option value="11" selected>Hasta 7ma mayor (11 semitonos)</option>
        <option value="13">Hasta 9na menor (13 semitonos)</option>
        <option value="24">Rango completo (24 semitonos)</option>
      </select>
    </section>

    <section class="campo campo-checkbox">
      <label for="aceptar-inversion">
        <input type="checkbox" id="aceptar-inversion">
        Aceptar también el intervalo invertido (según qué nota se tome como referencia)
      </label>
    </section>

    <section class="campo">
      <label for="pregunta">Notas</label>
      <p id="pregunta" class="pregunta-texto">Do &rarr; Re</p>
    </section>

    <section class="campo">
      <label for="opciones-intervalo">Tu respuesta</label>
    </section>
    <div id="opciones-intervalo" class="opciones-grid"></div>

    <div class="botones">
      <button id="btn-nueva" class="secundario">Nueva pregunta</button>
    </div>

    <p id="resultado" class="resultado" aria-live="polite"></p>

    <a class="enlace-volver" href="index.html">&larr; Volver al menú</a>
  </main>

  <script src="diapason.js?v=4"></script>
  <script src="script3.js?v=2"></script>
</body>
</html>
